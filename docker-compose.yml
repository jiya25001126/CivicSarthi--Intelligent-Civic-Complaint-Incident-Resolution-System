version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicsarthi-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - TRUST_PROXY=true
      - FRONTEND_ORIGIN=http://localhost,http://localhost:5173,http://localhost:80
      - JWT_SECRET=civicsarthi_prod_secure_secret_must_be_changed_in_real_deployment_32bytes
      - JWT_EXPIRES_IN=24h
      - PERSISTENCE_MODE=json
      - SLA_RESOLUTION_DEADLINE_DAYS=30
      - SLA_STALE_UPDATE_DAYS=7
      - SLA_REASSIGNMENT_LOOP_THRESHOLD=3
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicsarthi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: civicsarthi-network
